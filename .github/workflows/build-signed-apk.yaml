name: Build signed 8Vim Custom APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore private signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VIM8_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIM8_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure VIM8_RELEASE_KEYSTORE_BASE64 and VIM8_RELEASE_KEYSTORE_PASSWORD in repository Actions secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > 8vim/8vim-release.jks

      - name: Build permanently signed custom APK
        env:
          VIM8_BUILD_KEYSTORE_FILE: ./8vim-release.jks
          VIM8_BUILD_KEYSTORE_PASSWORD: ${{ secrets.VIM8_RELEASE_KEYSTORE_PASSWORD }}
          VIM8_BUILD_KEY_ALIAS: 8vim-custom
          VIM8_BUILD_KEY_PASSWORD: ${{ secrets.VIM8_RELEASE_KEYSTORE_PASSWORD }}
          VIM8_CUSTOM_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :8vim:assembleCustom --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find 8vim/build/outputs/apk/custom -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 8vim-custom-signed-apk
          path: 8vim/build/outputs/apk/custom/*.apk
          if-no-files-found: error
          retention-days: 30
